[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "muselab-from-scratch"
version = "0.1.0"
description = "CS336-style generative music course project: diffusion and flow matching"
requires-python = ">=3.10"
dependencies = [
"numpy>=1.26,<3",
"torch>=2.2",
"pretty_midi>=0.2.10",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: optional longer end-to-end training tests"]